<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Doctor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>🩺 Add Doctor</h1>
    <section class="panel">
      <h2>👨‍⚕️ Doctor Details</h2>
      <form class="form-grid" id="addDoctorForm">
        <label>First Name<input id="first_name" type="text" required></label>
        <label>Last Name<input id="last_name" type="text" required></label>
        <label>Specialization<input id="specialization" type="text" required></label>
        <label>License Number<input id="license_number" type="text"></label>
        <label>Phone<input id="contact_number" type="tel"></label>
        <label>Department ID<input id="department_id" type="number" required></label>
        <button class="btn btn-dark wide" type="submit">✅ Add Doctor</button>
        <a class="btn btn-outline wide" href="admin-dashboard.html">← Back to Dashboard</a>
      </form>
    </section>
  </main>
  <script>
    document.getElementById("addDoctorForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const doctorData = {
        first_name: document.getElementById("first_name").value.trim(),
        last_name: document.getElementById("last_name").value.trim(),
        specialization: document.getElementById("specialization").value.trim(),
        license_number: document.getElementById("license_number").value.trim(),
        contact_number: document.getElementById("contact_number").value.trim(),
        department_id: document.getElementById("department_id").value
      };

      try {
        const response = await fetch("http://localhost:3000/doctors", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(doctorData)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Failed to add doctor");
        }

        alert(result.message);
        this.reset();
      } catch (error) {
        alert(error.message);
      }
    });
  </script>
</body>
</html>
